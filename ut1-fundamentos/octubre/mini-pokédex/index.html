<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-Pokédex</title>
  <!--Fuente pixelada-->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet"> 
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="cabecera">
    <h1 class="logo">
      <span class="pokeball"></span>
      MINI-POKéDEX
    </h1>
  </header>
  <main class="contenedor">
    

    <p class="introduccion">
      Pulsa "Cargar Pokémon" y busca por nombre, número o parte del nombre.
    </p>

    <button id="boton-cargar" class="boton-cargar" type="button">Cargar Pokémon</button>

    <form id="formulario-busqueda" class="buscador">
      <label for="busqueda">Nombre o número</label>

      <div class="buscador__controles">
        <input
          id="busqueda"
          name="busqueda"
          type="text"
          placeholder="Ejemplo: pikachu o 25"
          autocomplete="off"
        >

        <button type="submit">Buscar</button>
      </div>
      <lable for="filtro-tipo">Tipo</lable>
      <select id="filtro-tipo" class="buscador__tipo">
        <option value="">Todos</option>
      </select>
    </form>

    <p id="mensaje" class="mensaje" aria-live="polite"></p>

    <section id="tarjetas" class="tarjetas"></section>
  </main>

  <dialog id="panel" class="panel">
    <button id="cerrar-panel" class="cerrar-panel" type="button" aria-label="Cerrar detalles">X</button>
    <div id="panel-contenido"></div>
  </dialog>

  <script src="js/Pokemon.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
